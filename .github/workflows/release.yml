name: Release

# Triggers on semver tag push (e.g. v0.1.0).
#
# Runner choice
# -------------
# CI runs on a self-hosted macOS runner (free, no billing). This release
# job intentionally runs on `ubuntu-latest` (GitHub-hosted) because npm's
# `--provenance` flag rejects publishes from self-hosted runners with a
# `422 Unprocessable Entity — Unsupported GitHub Actions runner environment`
# error. Releases are infrequent so the GitHub Actions minutes are
# negligible, and the supply-chain attestation lands in the public
# Sigstore transparency log.
#
# Authentication
# --------------
# Uses npm Trusted Publishing (OIDC). No token needed — `pnpm publish`
# detects the OIDC environment via `id-token: write` (granted below) and
# exchanges the GitHub Actions OIDC token for a short-lived npm scope
# at publish time. Configure / verify the trusted publisher at:
#   https://www.npmjs.com/package/@torsday/omnifocus-mcp/access
# (org `torsday`, repo `omnifocus-mcp`, workflow filename `release.yml`,
# environment blank). v1.0.1 was the first release verified end-to-end
# under OIDC; the bootstrap `NPM_TOKEN` secret used for v1.0.0 has been
# revoked (#428).
on:
  push:
    tags:
      - "v*.*.*"

# Read-only by default. The release job below grants the writes it needs
# (contents: write for the GitHub Release, id-token: write for npm provenance).
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest   # required by `pnpm publish --provenance` (see header)
    # Sized for the slowest historically-observed successful release run
    # (~26 min on 2026-05-09 / c551320) with 9 min headroom. Stryker
    # mutation testing alone takes ~19 min on this codebase; the prior
    # 20-min cap was tight enough to cancel v1.5.0 mid-Stryker on
    # 2026-05-10, leaving the tag + GitHub Release in place but no
    # publish to npm or Homebrew. Bump as Stryker scope grows; don't
    # tighten without checking historical run durations first.
    timeout-minutes: 35
    permissions:
      contents: write   # needed to create a GitHub Release
      id-token: write   # needed for npm provenance (and future OIDC publish)
    env:
      # Lifted to the job level so the Homebrew step's `if: env.X != ''`
      # conditional can read it. Step-level env is not in scope for the
      # same step's `if:` expression — that pattern silently skipped the
      # Homebrew formula update through every release before #670.
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history for release note generation

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Full pre-publish gate (mirrors CI on Node 24)
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # Mutation-testing release gate (per ADR-0017 §4).
      #
      # The gate runs once per release tag — between unit tests and publish — and
      # fails the release when the mutation score drops below the calibrated
      # `thresholds.break` in stryker.conf.json (currently 58 = floor(baseline) − 5
      # per ADR §3). The HTML + JSON reports are uploaded as workflow artifacts
      # for post-mortem on a fail and for traceability on a pass.
      - name: Stryker mutation testing (release gate)
        run: pnpm mutation

      - name: Upload mutation report
        if: always() # upload on fail too — the HTML report is how you triage
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ github.ref_name }}
          path: reports/mutation/
          if-no-files-found: error
          retention-days: 90

      - run: pnpm build

      # Integration gate — block publish when the integration suite hasn't
      # passed on this exact commit (gap 3 of #679).
      #
      # TOCTOU note: we check the run for GITHUB_SHA, not "latest run on main",
      # so a release can't ship code that integration never tested.  A 24 h
      # freshness check guards against a cached green run on a rewritten commit.
      #
      # The integration workflow also triggers on tag push (see integration.yml),
      # so on the happy path a green run will exist.  If gap 2 (#724) is merged
      # first, the PR check already enforced a green run before this commit
      # landed on main; the gate is then defence-in-depth (e.g. admin-override
      # merges that bypass the required-check gate).
      #
      # Soft-fail until #932 lands: the runner-host shares its OmniFocus
      # instance with the maintainer's active Claude clients; concurrent JXA
      # load can starve the integration suite's seed step. Until the
      # architectural fix (dedicated CI runner / bridge quiesce) lands, this
      # gate emits a `::warning::` annotation but does not fail the job, so
      # a release can still ship while the underlying contention is being
      # addressed. **Restore this to a hard gate the moment #932 is closed**;
      # see the comment in the script for the one-line revert.
      - name: Verify integration suite passed on this commit
        continue-on-error: true   # TEMPORARY (#932): see header comment above; restore on #932 close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="$GITHUB_SHA"
          run_json=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow integration.yml \
            --commit "$sha" \
            --limit 1 \
            --json conclusion,createdAt \
            --jq '.[0] // empty')

          if [ -z "$run_json" ]; then
            echo "::warning::No integration workflow run found for commit $sha — proceeding under #932 temporary soft-fail."
            # Soft-fail: re-enable as `exit 1` when #932 closes.
            exit 0
          fi

          conclusion=$(echo "$run_json" | jq -r '.conclusion')
          if [ "$conclusion" != "success" ]; then
            echo "::warning::Integration suite has not succeeded on $sha (got: $conclusion) — proceeding under #932 temporary soft-fail."
            # Soft-fail: re-enable as `exit 1` when #932 closes.
            exit 0
          fi

          # Freshness: the matched run must not pre-date now by more than 24 h.
          run_ts=$(echo "$run_json" | jq -r '.createdAt')
          run_epoch=$(date -d "$run_ts" +%s)
          now_epoch=$(date +%s)
          age_h=$(( (now_epoch - run_epoch) / 3600 ))
          if [ "$age_h" -gt 24 ]; then
            echo "::warning::Integration run for $sha is ${age_h}h old (> 24 h limit) — proceeding under #932 temporary soft-fail."
            # Soft-fail: re-enable as `exit 1` when #932 closes.
            exit 0
          fi

          echo "ok: integration suite passed on $sha (run age: ${age_h}h)."

          echo "Integration suite passed on $sha (run age: ${age_h}h)."

      - name: Bundle-size budget (< 800 KiB per DESIGN §20)
        run: bash scripts/check-bundle-size.sh

      # Extract release notes from CHANGELOG.md before publishing so a
      # missing section fails the run before npm publish — easier to
      # recover from than a published-but-undocumented version.
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(bash scripts/extract-changelog-section.sh "$VERSION")
          {
            echo "notes<<EOF_NOTES_$$"
            printf '%s\n' "$NOTES"
            echo "EOF_NOTES_$$"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        # --provenance writes a Sigstore attestation linking this published
        # tarball to this workflow run. Requires `id-token: write` (granted
        # above) and a public repo (we are public). With Trusted Publishing
        # configured on npm, no NODE_AUTH_TOKEN is needed — the npm CLI
        # auto-detects the OIDC environment.
        # --ignore-scripts skips prepublishOnly (typecheck/lint/test/build)
        # because those already ran as explicit steps above; running them again
        # on the same runner is redundant and caused repeated release failures
        # when lint errors were caught at publish time instead of the gate steps.
        run: pnpm publish --access public --no-git-checks --provenance --ignore-scripts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.notes.outputs.notes }}
          make_latest: true

      - name: Update Homebrew tap formula
        # Patches torsday/homebrew-tap/Formula/omnifocus-mcp.rb with the new
        # version + sha256 so `brew upgrade torsday/tap/omnifocus-mcp` works
        # immediately after the npm publish settles. Requires the
        # HOMEBREW_TAP_TOKEN repo secret (PAT with contents:write on the tap
        # repo) — wired in via the job-level env block above.
        #
        # GH_TOKEN is set to HOMEBREW_TAP_TOKEN so the gh CLI authenticates
        # as the PAT that has contents:write on torsday/homebrew-tap. The
        # default github.token (set by setup-node) is scoped to this repo
        # only and cannot write the tap repo.
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/update-homebrew-formula.sh "$VERSION"
