name: Integration Tests

# Runs on:
#   1. Manual dispatch — any branch, any contributor with write access
#   2. Tag push matching v* — automatically runs before a release
#   3. Pull requests targeting `main` — gated to canonical-repo branches; fork
#      PRs short-circuit the heavy job (no self-hosted runner access from forks).
#      Path-filtered: the suite only runs when the diff touches adapter, transport,
#      test, or build-config paths (see `paths-changed` job below).
#
# Requirements:
#   A self-hosted runner labeled `macos-omnifocus` with OmniFocus installed
#   and running. Contributors without access to this runner can execute the
#   integration tests locally: OMNIFOCUS_INTEGRATION=1 pnpm test:integration
#
#   Runner setup (auto-start, Automation permission, label): docs/runner-setup.md
#
# Required-check gate (gap 2 of #679):
#   The `integration-gate` job runs on ubuntu-latest for every trigger and
#   reports a single stable check name that branch protection on `main`
#   requires. On canonical-repo PRs it fails unless the integration job
#   succeeded; on fork PRs the integration job is intentionally skipped and
#   the gate accepts the skip so external contributors aren't blocked. On
#   PRs whose diff touches no integration-relevant paths, the gate accepts
#   the skip with skip-cause=paths-irrelevant (see #880).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit SHA to test (defaults to the current branch)"
        required: false
        default: ""

  push:
    tags:
      - "v*"

  pull_request:
    branches:
      - main

# Read-only — integration tests run typecheck/build/test against OmniFocus and
# upload artifacts on failure; nothing writes back to the repo.
permissions:
  contents: read

concurrency:
  # Only one integration run at a time per ref — OmniFocus is single-threaded.
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paths-changed:
    # Determines whether the PR diff touches paths that require integration
    # tests. Runs only on pull_request events; skipped on push/dispatch so
    # those triggers always run the full suite regardless.
    name: Detect paths needing integration
    runs-on: ubuntu-latest  # allow-hosted: path detection only — no OmniFocus access needed
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    outputs:
      needs_integration: ${{ steps.filter.outputs.integration }}
    steps:
      - name: Check paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            integration:
              - 'src/adapter/**'
              - 'src/domain/**'
              - 'src/transport/**'
              - 'tests/integration/**'
              - 'tests/contract/**'
              - 'tests/e2e/**'
              - 'tests/fixtures/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - 'scripts/seed-integration-db.js'
              - 'scripts/check-automation-permission.sh'
              - '.github/workflows/integration.yml'

  integration:
    name: Integration tests (OmniFocus ${{ matrix.of-version }})
    # Skip the heavy job on fork PRs — self-hosted runners are not available
    # to forked workflows by GitHub's security model. The `integration-gate`
    # job below tolerates this skip when the PR is from a fork; on canonical-
    # repo PRs the skip becomes a failure (the runner is expected).
    #
    # Also skip on pull_request events whose diff touches no integration-
    # relevant paths (paths-changed job above sets needs_integration=false).
    # On push (tags) and workflow_dispatch the suite always runs regardless
    # of paths — needs.paths-changed.outputs.needs_integration is '' for
    # those events, so the first clause covers them.
    if: >-
      (github.event_name != 'pull_request') ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       needs.paths-changed.outputs.needs_integration == 'true')
    needs: [paths-changed]
    runs-on: [self-hosted, macos-omnifocus]
    # Cap the heavy job so a wedged osascript / hung integration test surfaces
    # as a clean failure instead of holding the single self-hosted runner for
    # the GitHub default of 6h and starving every other PR's required checks.
    # CI workflow has the same kind of cap (15m); this matches at 30m to give
    # the suite + seeding headroom over its typical 8–12m wall time.
    timeout-minutes: 30

    strategy:
      # Run all matrix entries even if one fails (collect full picture).
      fail-fast: false
      matrix:
        node-version: [24]
        of-version: [current]   # Add "3.15", "4.x" when runners for those are available

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Ensure OmniFocus is responsive (reset only if wedged)
        # Cross-PR runs share the self-hosted runner and its single OmniFocus
        # instance. Database residue is cleared by `seed-integration-db.js
        # --clean` below, but *process* state (in-flight sync queue, undo
        # stack, transcript, cached AppleEvents state) can survive between
        # runs and has been observed to wedge OmniFocus into intermittent
        # slow paths — surfacing as different-tests-fail-each-PR flake.
        # See #914.
        #
        # Two-stage strategy:
        #   1. Probe — is OmniFocus already JXA-responsive? If yes, skip
        #      the reset and keep its warm caches (the suite is ~3× faster
        #      against a warm OF than a cold-launched one).
        #   2. If wedged, quit + relaunch + warmup loop. Pays cold-cache
        #      cost, but that's better than running tests against a wedge.
        #
        # `osascript` has no built-in timeout flag and will block
        # indefinitely against a wedged OF, so each probe/warmup call is
        # wrapped in perl's alarm()/exec() pattern (15s deadline). GNU
        # `timeout` is not available on macOS without `brew install
        # coreutils`; perl is always present at /usr/bin/perl.
        run: |
          set -euo pipefail
          probe='const of = Application("OmniFocus"); JSON.stringify(of.defaultDocument.name())'

          # Stage 1: cheap probe.
          if perl -e '$t=shift; alarm $t; exec @ARGV' 15 osascript -l JavaScript -e "$probe" >/dev/null 2>&1; then
            echo "OmniFocus is already JXA-responsive — skipping reset (preserves warm cache)."
            exit 0
          fi

          # Stage 2: reset.
          echo "OmniFocus did not respond within 15s — performing quit + relaunch."
          osascript -e 'tell application "OmniFocus" to quit' 2>/dev/null || true
          for _ in $(seq 1 30); do
            if ! osascript -e 'tell application "System Events" to (name of processes) contains "OmniFocus"' | grep -q true; then
              echo "OmniFocus has exited."
              break
            fi
            sleep 1
          done
          open -a OmniFocus
          for _ in $(seq 1 60); do
            if osascript -e 'tell application "System Events" to (name of processes) contains "OmniFocus"' | grep -q true; then
              echo "OmniFocus has relaunched."
              break
            fi
            sleep 1
          done

          # Warm up: poll for JXA-responsiveness, capped at ~3 minutes.
          warmed=0
          for attempt in $(seq 1 18); do
            if perl -e '$t=shift; alarm $t; exec @ARGV' 15 osascript -l JavaScript -e "$probe" >/dev/null 2>&1; then
              echo "OmniFocus is JXA-responsive (attempt $attempt)."
              warmed=1
              break
            fi
            echo "OmniFocus not yet responsive (attempt $attempt) — waiting 10s."
            sleep 10
          done
          if [ "$warmed" -ne 1 ]; then
            echo "::error::OmniFocus relaunched but did not become JXA-responsive within 3 minutes."
            exit 1
          fi

      - name: Verify OmniFocus is running
        # Exits non-zero if OmniFocus is not running; surfaces a clear message
        # rather than a cryptic adapter error inside the test suite.
        run: |
          if ! osascript -e 'tell application "System Events" to (name of processes) contains "OmniFocus"' | grep -q true; then
            echo "::error::OmniFocus is not running on this runner. Start OmniFocus before running integration tests."
            exit 1
          fi
          echo "OmniFocus is running — proceeding with integration tests."

      - name: Check macOS Automation permission
        # Detects error -1743 ("Not authorized to send Apple events") before
        # the test suite runs so failures surface a clear diagnostic rather
        # than a generic "JXA script returned empty stdout" error.
        run: bash scripts/check-automation-permission.sh

      - name: Seed integration fixtures
        # The integration suite operates on `mcp-fixture:`-prefixed
        # folders, projects, tasks, and tags. `--clean` first wipes any
        # leftover fixtures from prior cancelled / partial runs, then
        # re-creates the canonical set — so the test suite starts from a
        # known state every run. Without `--clean`, `mcp-fixture:` orphans
        # accumulate across cancelled runs (today's 2026-05-10 release-
        # pipeline incident hit 25 stale fixture tags before someone
        # noticed), and tests that assert "this is the only fixture
        # with name X" start failing intermittently. See #929 for the
        # mode-comments / docstring fix in the seed script itself, and
        # #928 for the matching runner-side job-started hook (defense
        # in depth — works even if a new runner doesn't have this flag
        # plumbed through).
        run: node scripts/seed-integration-db.js --clean

      - name: Run integration tests
        env:
          OMNIFOCUS_INTEGRATION: "1"
          OMNIFOCUS_LOG_LEVEL: warn     # Suppress noise; failures are still visible
        run: pnpm test:integration

      - name: Clean up fixtures
        # `if: always()` is the whole point (#1101). The sandbox harness
        # bulk-deletes its own `mcp-fixture-<runId>` folder in `afterAll`,
        # but a killed suite (timeout, job cancel, crash) skips that teardown
        # and leaves the fixture tree in the live database — which is how a
        # ~60-object sandbox tree survived a cancelled release-pipeline run.
        # The pre-suite seed `--clean` only sweeps on the *next* run, which
        # may be days away; this step sweeps now, every time, pass or fail.
        # Clean-only (no re-seed) so it's a pure teardown.
        if: always()
        run: node scripts/clean-integration-db.js

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results-${{ matrix.node-version }}-${{ github.run_id }}
          path: |
            test-results/
            *.log
          retention-days: 7

  integration-gate:
    # Stable required-check name for branch protection on `main`. Always runs
    # on ubuntu-latest so the gate is reachable even when the self-hosted
    # `macos-omnifocus` runner is offline — that's exactly the failure mode
    # this gate is designed to surface (gap 2 of #679).
    #
    # Decision matrix (input: integration job result + PR origin + path relevance):
    #   success                                          → pass
    #   skipped + fork PR                                → pass  (forks lack runner access by design)
    #   skipped + canonical PR + paths-irrelevant        → pass  (diff doesn't touch adapter/test paths)
    #   skipped + canonical PR / push / dispatch (other) → fail  (runner expected, didn't run)
    #   failure / cancelled, pull_request event          → soft-fail (warn, exit 0) per #932/#955
    #   failure / cancelled, push or dispatch            → fail
    name: integration-gate
    runs-on: ubuntu-latest  # allow-hosted: gate must be reachable when self-hosted runner is offline (gap 2 of #679)
    timeout-minutes: 5
    needs: [integration, paths-changed]
    if: always()
    steps:
      - name: Evaluate integration outcome
        env:
          RESULT: ${{ needs.integration.result }}
          EVENT: ${{ github.event_name }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          PATHS_RELEVANT: ${{ needs.paths-changed.outputs.needs_integration }}
        run: |
          echo "integration result: $RESULT (event=$EVENT is_fork=$IS_FORK paths_relevant=$PATHS_RELEVANT)"
          if [ "$RESULT" = "success" ]; then
            echo "ok: integration suite passed; skip-cause=none"
            exit 0
          fi
          if [ "$RESULT" = "skipped" ] && [ "$IS_FORK" = "true" ]; then
            echo "ok: fork PR — integration skipped is acceptable (no self-hosted runner access); skip-cause=fork-skip"
            exit 0
          fi
          if [ "$RESULT" = "skipped" ] && [ "$EVENT" = "pull_request" ] && [ "$PATHS_RELEVANT" = "false" ]; then
            echo "ok: diff touches no integration-relevant paths; skip-cause=paths-irrelevant"
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            echo "::warning::Integration suite did not pass (result=$RESULT). Soft-failing on PR per #932 contention; merge gating relies on local-verify discipline (see #955). The integration job still ran and its failures are visible above — review them before merging."
            # Soft-fail: re-enable as `exit 1` when #932 closes.
            exit 0
          fi
          echo "::error::Integration suite did not pass (result=$RESULT). On push (tag) / workflow_dispatch this gate requires the macos-omnifocus runner to be online and the suite green."
          exit 1
