# Board-state sync for the user-owned Projects v2 board `torsday/projects/4`.
#
# Requires a repo secret `PROJECT_TOKEN` — a fine-grained PAT with:
#   - User permission "Projects: Read and write"
#   - Repository permission "Issues: Read and write"
# GITHUB_TOKEN can't write to user-owned projects; the PAT is required.
#
# Field/option IDs are sourced from `scripts/_project-constants.sh` at job start
# (single source of truth — see that file for rediscovery commands if the project
# is ever recreated).

name: Board sync

on:
  pull_request:
    # `ready_for_review` fires when a draft flips to ready — that's the right
    # moment to move linked issues to "In Review". Raw `opened`/`reopened` on
    # a draft is premature; the job below guards with draft == false.
    # `synchronize` fires on every push to a PR's head ref. Without it, the
    # required `pr` status check is only attached to the head SHA at the time
    # of `opened`/`reopened`, so any subsequent push leaves the PR
    # `mergeStateStatus: BLOCKED` despite every other required check being
    # green. Including it here keeps the `pr` check fresh on every push and
    # makes the status-checks gate honest. (#905)
    types: [opened, reopened, ready_for_review, closed, synchronize]
  issues:
    # `opened` → add the new issue to the board in Backlog so externally-filed
    # reports enter the tracked queue (tier / priority stay a human/groom call).
    types: [opened, closed, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: read

env:
  GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}

jobs:
  pr:
    # Fork-PR guard: skip when the PR comes from a fork — fork code cannot
    # execute on the self-hosted runner. (Fork PRs also wouldn't have access to
    # PROJECT_TOKEN by default, so blocking here is both security and correctness.)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check token
        id: token
        run: |
          if [ -n "$GH_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::PROJECT_TOKEN not set — skipping board sync. Add a PAT with Projects read/write to enable."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.token.outputs.ok == 'true'

      - name: Load project constants
        if: steps.token.outputs.ok == 'true'
        run: |
          if [ ! -f scripts/_project-constants.sh ]; then
            echo "::warning::scripts/_project-constants.sh not found (gitignored; must be present on the runner). Skipping board sync."
            exit 0
          fi
          # shellcheck source=../../scripts/_project-constants.sh
          source scripts/_project-constants.sh
          {
            echo "PROJECT_ID=$PROJECT_ID"
            echo "STATUS_FIELD=$F_STATUS"
            echo "OPT_IN_REVIEW=$STATUS_IN_REVIEW"
            echo "OPT_DONE=$STATUS_DONE"
          } >> "$GITHUB_ENV"

      - name: Extract linked issue numbers from PR body
        id: linked
        if: steps.token.outputs.ok == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          nums=$(printf '%s' "$PR_BODY" \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' \
            | sort -u \
            | tr '\n' ' ')
          echo "nums=$nums" >> "$GITHUB_OUTPUT"
          echo "Linked issues: ${nums:-<none>}"

      - name: PR opened (ready) → flip linked issues to In Review
        # Only flip on non-draft opens, reopens, or draft→ready transitions.
        # Draft PRs stay on whatever status they had (typically In Progress).
        if: >-
          steps.token.outputs.ok == 'true' && (
          (github.event.action == 'opened' && github.event.pull_request.draft == false) ||
          (github.event.action == 'reopened' && github.event.pull_request.draft == false) ||
          github.event.action == 'ready_for_review')
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          NUMS: ${{ steps.linked.outputs.nums }}
        run: |
          # shellcheck disable=SC2016  # $o/$r/$n are GraphQL variables, not shell expansions
          for n in $NUMS; do
            item=$(gh api graphql \
              -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){issue(number:$n){projectItems(first:10){nodes{id project{id}}}}}}' \
              -F o="$OWNER" -F r="$REPO" -F n="$n" \
              --jq ".data.repository.issue.projectItems.nodes[] | select(.project.id==\"$PROJECT_ID\") | .id" || true)
            [ -z "$item" ] && { echo "#$n not on project — skip"; continue; }
            gh api graphql -f query="mutation{updateProjectV2ItemFieldValue(input:{projectId:\"$PROJECT_ID\",itemId:\"$item\",fieldId:\"$STATUS_FIELD\",value:{singleSelectOptionId:\"$OPT_IN_REVIEW\"}}){projectV2Item{id}}}" >/dev/null
            echo "#$n → In Review"
          done

      - name: PR merged → flip linked issues to Done + strip label
        if: steps.token.outputs.ok == 'true' && github.event.action == 'closed' && github.event.pull_request.merged == true
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          NUMS: ${{ steps.linked.outputs.nums }}
        run: |
          # shellcheck disable=SC2016  # $o/$r/$n are GraphQL variables, not shell expansions
          for n in $NUMS; do
            item=$(gh api graphql \
              -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){issue(number:$n){projectItems(first:10){nodes{id project{id}}}}}}' \
              -F o="$OWNER" -F r="$REPO" -F n="$n" \
              --jq ".data.repository.issue.projectItems.nodes[] | select(.project.id==\"$PROJECT_ID\") | .id" || true)
            if [ -n "$item" ]; then
              gh api graphql -f query="mutation{updateProjectV2ItemFieldValue(input:{projectId:\"$PROJECT_ID\",itemId:\"$item\",fieldId:\"$STATUS_FIELD\",value:{singleSelectOptionId:\"$OPT_DONE\"}}){projectV2Item{id}}}" >/dev/null
              echo "#$n → Done"
            fi
            gh issue edit "$n" --remove-label "status: in-progress" 2>/dev/null || true
          done

  issue-opened:
    # New issue (any author, including external bug/feature reports) → add to
    # the board in Backlog so it enters the tracked queue. Tier (`model: *`)
    # and Priority are deliberately left for human / `/groom` triage.
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check token
        id: token
        run: |
          if [ -n "$GH_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::PROJECT_TOKEN not set — skipping board sync."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.token.outputs.ok == 'true'

      - name: Load project constants
        if: steps.token.outputs.ok == 'true'
        run: |
          if [ ! -f scripts/_project-constants.sh ]; then
            echo "::warning::scripts/_project-constants.sh not found (gitignored; must be present on the runner). Skipping board sync."
            exit 0
          fi
          # shellcheck source=../../scripts/_project-constants.sh
          source scripts/_project-constants.sh
          {
            echo "PROJECT_ID=$PROJECT_ID"
            echo "STATUS_FIELD=$F_STATUS"
            echo "OPT_BACKLOG=$STATUS_BACKLOG"
          } >> "$GITHUB_ENV"

      - name: Add issue to board → Backlog
        if: steps.token.outputs.ok == 'true'
        env:
          CONTENT_ID: ${{ github.event.issue.node_id }}
        run: |
          # addProjectV2ItemById is idempotent — re-adding an issue already on
          # the project returns its existing item id, so this never duplicates.
          item=$(gh api graphql \
            -f query='mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}}' \
            -F p="$PROJECT_ID" -F c="$CONTENT_ID" \
            --jq '.data.addProjectV2ItemById.item.id' || true)
          if [ -z "$item" ]; then
            echo "::warning::failed to add issue to project — skipping Status flip"
            exit 0
          fi
          gh api graphql -f query="mutation{updateProjectV2ItemFieldValue(input:{projectId:\"$PROJECT_ID\",itemId:\"$item\",fieldId:\"$STATUS_FIELD\",value:{singleSelectOptionId:\"$OPT_BACKLOG\"}}){projectV2Item{id}}}" >/dev/null
          echo "#${{ github.event.issue.number }} added to board → Backlog"

  issue-closed:
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check token
        id: token
        run: |
          if [ -n "$GH_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::PROJECT_TOKEN not set — skipping board sync."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.token.outputs.ok == 'true'

      - name: Load project constants
        if: steps.token.outputs.ok == 'true'
        run: |
          if [ ! -f scripts/_project-constants.sh ]; then
            echo "::warning::scripts/_project-constants.sh not found (gitignored; must be present on the runner). Skipping board sync."
            exit 0
          fi
          # shellcheck source=../../scripts/_project-constants.sh
          source scripts/_project-constants.sh
          {
            echo "PROJECT_ID=$PROJECT_ID"
            echo "STATUS_FIELD=$F_STATUS"
            echo "OPT_DONE=$STATUS_DONE"
          } >> "$GITHUB_ENV"

      - name: Flip closed issue to Done + strip label
        if: steps.token.outputs.ok == 'true'
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          N: ${{ github.event.issue.number }}
        run: |
          # shellcheck disable=SC2016  # $o/$r/$n are GraphQL variables, not shell expansions
          item=$(gh api graphql \
            -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){issue(number:$n){projectItems(first:10){nodes{id project{id}}}}}}' \
            -F o="$OWNER" -F r="$REPO" -F n="$N" \
            --jq ".data.repository.issue.projectItems.nodes[] | select(.project.id==\"$PROJECT_ID\") | .id" || true)
          if [ -n "$item" ]; then
            gh api graphql -f query="mutation{updateProjectV2ItemFieldValue(input:{projectId:\"$PROJECT_ID\",itemId:\"$item\",fieldId:\"$STATUS_FIELD\",value:{singleSelectOptionId:\"$OPT_DONE\"}}){projectV2Item{id}}}" >/dev/null
            echo "#$N → Done"
          fi
          gh issue edit "$N" --remove-label "status: in-progress" 2>/dev/null || true
