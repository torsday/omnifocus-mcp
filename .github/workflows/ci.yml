name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

# Read-only by default — this workflow just runs typecheck/lint/test/build.
# Any future job that needs to write should grant write at the job level.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # ubuntu-latest, not the self-hosted macOS runner. This job runs
    # `pnpm typecheck/lint/test/build` against the InMemoryAdapter — none
    # of which exercises macOS-specific code (osascript / OmniFocus calls
    # live behind the JxaTransport and OmniJsTransport, which only run when
    # `OMNIFOCUS_INTEGRATION=1` triggers `integration.yml` on the dedicated
    # `macos-omnifocus` runner). Keeping CI on the self-hosted runner forced
    # it to share queue with the integration suite — so a single hung
    # integration test would block every queued PR's required `build (Node 24)`
    # check for hours (see watchdog.sh in github-runners/, plus #912's
    # `timeout-minutes: 30` cap on integration). Moving CI to ubuntu-latest
    # restores parallelism without changing what the build job verifies.
    runs-on: ubuntu-latest  # allow-hosted (verify-no-hosted-runners.sh: documented exception)
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [24]
    name: build (Node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      - name: Bundle-size budget (< 800 KiB per DESIGN §20)
        run: bash scripts/check-bundle-size.sh
