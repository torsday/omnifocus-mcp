# Lint the tracker/board plumbing itself.
#
# scripts/_project-constants.sh is now load-bearing for four downstream
# consumers plus a workflow. A typo (missing quote, unbound var, wrong
# variable name) would silently break every consumer. This job catches
# it at PR time before the damage propagates.
#
# Runs only on PRs that touch scripts/ or .github/workflows/ — no point
# burning CI minutes on every PR.
#
# Targets the self-hosted macOS runner so we don't pay GitHub-hosted
# rates and aren't blocked by the account's Actions billing state.
# `shellcheck` and `actionlint` are installed via Homebrew on the runner;
# the actions used previously (`ludeeus/action-shellcheck`,
# `raven-actions/actionlint`) are Docker-based and only run on Linux.

name: Meta lint

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/**"
      - "**/*.md"
      # nl-quality job below scans every tool description + Zod input schema —
      # rerun on any src/tools/** change.
      - "src/tools/**"
      # Required status checks bind to job names from this workflow. If a PR
      # touches only src/scripts/** (e.g. a JXA helper extraction like #703)
      # without any of the paths above, branch protection blocks the merge
      # waiting for jobs that never fired. Include src/scripts/** so the
      # regression guards run on script-only PRs too — they're cheap on
      # unchanged inputs, and #703 hit this exact gap.
      - "src/scripts/**"
      # Same gap re-surfaced on #709 — a watcher-only diff didn't fire any
      # meta-lint job, and branch protection blocked the merge. Widen the
      # net to src/** so any production-code diff fires the regression guards.
      - "src/**"
      # tests-only PRs (e.g. #903) hit the same wall — touching only
      # tests/** triggers no meta-lint job and branch protection blocks
      # the merge waiting on required jobs that never fired. Cover the
      # tests tree too; the regression guards are cheap on unchanged inputs.
      - "tests/**"
      # dep-bump PRs (dependabot/renovate) only touch package.json and
      # pnpm-lock.yaml. Without these entries the workflow never fires,
      # required checks are never reported, and branch protection blocks
      # the merge requiring an admin bypass (#736).
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  shellcheck:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Ensure shellcheck is installed
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version
      - name: Run shellcheck on scripts/*.sh
        # bash 3.2 is macOS default; lint against it so we catch features
        # (associative arrays, `readarray`, etc.) that would break locally.
        run: shellcheck --shell=bash --severity=warning scripts/*.sh

  actionlint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Ensure actionlint is installed
        run: |
          if ! command -v actionlint >/dev/null 2>&1; then
            bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
            sudo mv ./actionlint /usr/local/bin/actionlint
          fi
          actionlint --version
      - name: Run actionlint on .github/workflows/*.yml
        # actionlint shells out to shellcheck for any embedded `run:` blocks.
        # Same severity bar as the standalone shellcheck job.
        run: actionlint -shellcheck="--severity=warning"

  no-hosted-runners:
    # Regression guard — fails if any workflow re-introduces a GitHub-hosted
    # runner (`ubuntu-latest`, `macos-latest`, `windows-latest`). Every
    # workflow in this repo runs on `[self-hosted, macos]`.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Verify no GitHub-hosted runners are referenced
        run: scripts/verify-no-hosted-runners.sh

  no-tool-counts:
    # Regression guard — fails if any living doc restates the count of
    # registered MCP tools. Per #478, prose docs describe the SHAPE of
    # the tool surface; the COUNT lives at `omnifocus://capabilities`
    # and `internal_status` at runtime, plus `docs/tools.md` (auto-
    # generated, allowlisted). Every release used to touch one doc and
    # miss four others; this guard removes the regression class.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Verify no tool-count strings in living docs
        run: scripts/verify-no-tool-counts.sh

  migrations-doc:
    # Regression guard — any PR labelled `breaking-change` must update
    # docs/migrations.md with what changed, why, and how to migrate.
    # Surfaces as an ::error:: annotation on the doc itself.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Collect PR labels and changed files
        id: ctx
        run: |
          labels=$(gh pr view "${{ github.event.pull_request.number }}" \
            --json labels --jq '[.labels[].name] | join(",")' 2>/dev/null || echo "")
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | tr '\n' ' ')
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify migrations.md updated for breaking-change PRs
        run: scripts/verify-migrations-doc.sh
        env:
          PR_LABELS: ${{ steps.ctx.outputs.labels }}
          CHANGED_FILES: ${{ steps.ctx.outputs.changed }}

  nl-quality:
    # NL-quality lint per `docs/nl-quality-standards.md` — every tool
    # description includes a worked Example, every Zod input schema field
    # has `.describe()`. Files exempted in
    # `scripts/nl-quality-allowlist.json` (graduated by the audit pass
    # tracked in #563). Wired into `pnpm lint` too; this duplicate gate
    # surfaces failures as `::error::` annotations directly on the PR.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:nl-quality

  workflow-timeouts:
    # Regression guard — fails if any workflow job lacks an explicit
    # `timeout-minutes:`. Without one a hung step holds the runner for
    # GitHub's 6-hour default; the 2026-05-10 incident hit this exactly
    # (#912 capped integration.yml at 30m after a hung osascript held the
    # macOS runner for 70+ minutes). This guard codifies the lesson at the
    # workflow-author level. See scripts/verify-workflow-timeouts.sh.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify every workflow job declares timeout-minutes
        run: scripts/verify-workflow-timeouts.sh

  pnpm-audit:
    # Surface dependabot-style advisories on every dep-touching PR — this
    # is the followup from #918 (pnpm overrides cleared 8 advisories that
    # had been showing up on every push for weeks). Informational, not
    # blocking: an unfixable upstream advisory shouldn't gate unrelated
    # PRs, but the warning surface keeps the security panel honest at PR
    # time instead of letting noise accumulate at push time.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (informational — surfaces moderate+ advisories)
        run: |
          set +e
          pnpm audit --audit-level=moderate
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::warning::pnpm audit found moderate-or-higher advisories — run \`pnpm audit\` locally and consider a pnpm.overrides bump"
          fi
          # Always exit 0 — informational only.
          exit 0

  release-notes-polish:
    # Fail release-please PRs whose newly-added CHANGELOG section is still
    # in raw bot-output shape (no Summary paragraph, single-line bot
    # bullets). Codifies the lesson from 2026-05-10: three releases
    # (v1.4.0, v1.5.0, v1.5.1) shipped with raw bot output because the
    # /release-notes polish step in .claude/commands/release.md was
    # skipped during auto-merge. See #927 / #925.
    #
    # Only runs on release-please PRs (head ref matches release-please--*);
    # no-ops for everything else. Escape hatch: add the
    # `release-notes-polish-ack` label to permit a bot-output release for
    # the rare case where polishing makes no sense (e.g., a one-line
    # patch).
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Collect PR labels
        id: ctx
        run: |
          labels=$(gh pr view "${{ github.event.pull_request.number }}" \
            --json labels --jq '[.labels[].name] | join(",")' 2>/dev/null || echo "")
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify CHANGELOG section is polished
        run: scripts/verify-release-notes-polish.sh
        env:
          PR_LABELS: ${{ steps.ctx.outputs.labels }}
