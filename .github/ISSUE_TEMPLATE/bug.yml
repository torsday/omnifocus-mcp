name: Bug
description: Something in the built MCP server is broken
title: "<short description of the bad behavior — no [bug] prefix; the type label carries that>"
labels: ["type: bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-sentence description.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Step-by-step. Include the MCP tool invocation and any relevant inputs.
      placeholder: |
        1. Start server with `OMNIFOCUS_LOG_LEVEL=debug npx @torsday/omnifocus-mcp`
        2. Invoke `task_create { name: "Test", dueDate: "2026-05-01T17:00:00-05:00" }`
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error response envelope if any.
    validations:
      required: true
  - type: input
    id: of-version
    attributes:
      label: OmniFocus version
      placeholder: "e.g. 4.5.2"
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "e.g. 14.5"
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "e.g. 20.12.0"
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: stderr JSON lines, redacted of PII
      render: shell
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: |
        List dependencies using either `Blocked by: #N` (this issue depends on N — record on the dependent's body) or `Blocks: #N` (this issue blocks N — record on the blocker's body). `/groom`'s dependency audit reads both directions and resolves them to the same edge.
      placeholder: |
        - Blocked by: #123
        - Blocks: #456
